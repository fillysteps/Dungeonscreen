name: Build DungeonScreen Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '**/*.zip'
      - 'android/**'
      - 'DungeonScreen-Mobile/android/**'
      - '.github/workflows/build-dungeonscreen-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate or extract DungeonScreen Android project
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/dungeonscreen-source"
          mkdir -p "$work"

          # Accept source uploaded as extracted files, a source ZIP, or the outer build-kit ZIP.
          locate_project() {
            local candidate
            while IFS= read -r -d '' candidate; do
              local dir="${candidate%/settings.gradle}"
              if [[ -f "$dir/app/build.gradle" && -f "$dir/app/src/main/AndroidManifest.xml" ]]; then
                printf '%s\n' "$dir"
                return 0
              fi
            done < <(find "$GITHUB_WORKSPACE" "$work" -type f -path '*/android/settings.gradle' -print0)
            return 1
          }

          project_dir="$(locate_project || true)"
          if [[ -z "$project_dir" ]]; then
            # Look for a source ZIP; if the user uploaded the outer build-kit, extract it first.
            i=0
            while IFS= read -r -d '' archive; do
              i=$((i+1))
              target="$work/upload-$i"
              mkdir -p "$target"
              echo "Inspecting ZIP: $archive"
              if ! unzip -tq "$archive" >/dev/null; then
                echo "WARNING: ZIP is unreadable: $archive"
                continue
              fi
              unzip -q "$archive" -d "$target"
              project_dir="$(locate_project || true)"
              if [[ -n "$project_dir" ]]; then break; fi
              # An outer build kit contains a second (source) ZIP.
              j=0
              while IFS= read -r -d '' inner; do
                j=$((j+1))
                nested="$target/extracted-inner-$j"
                mkdir -p "$nested"
                echo "Inspecting nested ZIP: $inner"
                if unzip -tq "$inner" >/dev/null; then
                  unzip -q "$inner" -d "$nested"
                  project_dir="$(locate_project || true)"
                  if [[ -n "$project_dir" ]]; then break; fi
                fi
              done < <(find "$target" -maxdepth 4 -type f -name '*.zip' -print0)
              if [[ -n "$project_dir" ]]; then break; fi
            done < <(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -name '*.zip' -print0)
          fi

          if [[ -z "$project_dir" ]]; then
            echo '::error::Android project not found. Upload either DungeonScreen-Android-Source-v1.4.2.zip OR the complete DungeonScreen-v1.4.2-GitHub-APK-Build-Kit.zip to the repository root, then rerun.'
            echo 'Repository files:'
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -not -path '*/.git/*' | head -80
            exit 1
          fi
          echo "Android project found: $project_dir"
          printf 'ANDROID_PROJECT_DIR=%s\n' "$project_dir" >> "$GITHUB_ENV"

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile debug APK
        run: gradle --project-dir "$ANDROID_PROJECT_DIR" --no-daemon :app:assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          src="$ANDROID_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$src" || { echo '::error::No APK generated by Gradle.'; exit 1; }
          cp "$src" DungeonScreen-v1.4.2-debug.apk
          ls -lh DungeonScreen-v1.4.2-debug.apk

      - name: Upload downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: DungeonScreen-Android-APK
          path: DungeonScreen-v1.4.2-debug.apk
          if-no-files-found: error
          retention-days: 14
